data:
  db_name: "mitdb"
  data_dir: "./data/raw"
  processed_dir: "./data/processed"
  dataset_mode: "beat"
  use_filtering: true
  classes:
    0: "Normal (N)"
    1: "Supraventricular / A-Fib (SVEB/A)"
    2: "Ventricular Ectopic / PVC (VEB/PVC)"
    3: "Fusion / Ventricular Tachycardia (F/VT)"
    4: "Unknown / Paced / Other (Q)"
  num_classes: 5
  raw_sampling_rate: 360
  target_sampling_rate: 128
  lowcut: 0.5
  highcut: 50.0
  filter_order: 4
  beat_window_size: 256
  matrix_rows: 16
  matrix_cols: 16
  segment_duration_sec: 10
  samples_per_segment: 1280

split:
  split_mode: "inter_patient"
  train_ratio: 0.80
  val_ratio: 0.20
  ds1_train_recordings: ["101", "106", "108", "109", "112", "114", "115", "116", "118", "119", "122", "124", "201", "203", "205", "207", "208", "209", "215", "220", "223", "230"]
  ds2_test_recordings: ["100", "103", "105", "111", "113", "117", "121", "123", "200", "202", "210", "212", "213", "214", "219", "221", "222", "228", "231", "232", "233", "234"]

model:
  name: "hybrid_1d_cnn_transformer_fusion"  # Ultimate RR-Interval Fusion + Focal Loss Model
  in_channels: 1
  matrix_rows: 16
  matrix_cols: 16
  num_classes: 5
  cnn_filters: [32, 48, 48]
  seq_len: 32
  d_model: 48
  nhead: 4
  dim_feedforward: 48
  dropout: 0.2

training:
  epochs: 25
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 1.0e-4
  use_focal_loss: true     # Active Focal Loss (gamma=2.0)
  focal_gamma: 2.0
  use_class_weights: true  # Inverse class weights [1.0, 10.0, 3.0, 10.0, 50.0]
  use_oversampling: true     # WeightedRandomSampler
  checkpoint_dir: "./checkpoints"
  device: "auto"
